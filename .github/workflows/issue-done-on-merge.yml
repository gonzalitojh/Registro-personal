name: issue-done-on-merge

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número de PR (pruebas manuales)'
        required: true
        type: number
      pr_body:
        description: 'Body de la PR (pruebas manuales)'
        required: true
        type: string

permissions:
  issues: write
  pull-requests: read

jobs:
  mark-issues-done:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Marcar issues referenciadas como ai-done y cerrarlas
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            if (pr) {
              // Guard de forks: solo PRs del propio repo (permite colaboradores).
              if (pr.head.repo.full_name !== context.repo.full_name) {
                core.notice('PR de fork: se omite la actualización de issues');
                return;
              }
            }
            const body = (pr && pr.body) || context.payload.inputs.pr_body || '';
            if (context.payload.inputs && context.payload.inputs.pr_number) {
              core.notice(`Prueba manual (workflow_dispatch) para la PR #${context.payload.inputs.pr_number}`);
            }
            // Keywords oficiales de cierre de GitHub (case-insensitive, dos puntos opcionales).
            const re = /\b(?:closes?|closed|fix(?:es|ed)?|resolves?|resolved)\s*:?\s*#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(re)].map(m => Number(m[1])))];
            if (numbers.length === 0) {
              core.notice('La PR no referencia issues con keywords de cierre');
              return;
            }
            for (const n of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
                const aiLabels = (issue.labels || []).map(l => l.name).filter(x => x.startsWith('ai-'));
                if (aiLabels.length === 0) {
                  core.notice(`#${n}: sin label ai-* (issue de usuario) → sin cambios`);
                  continue;
                }
                for (const label of aiLabels) {
                  if (label !== 'ai-done') {
                    await github.rest.issues.deleteLabel({ owner, repo, issue_number: n, name: label });
                    core.notice(`#${n}: label '${label}' eliminada`);
                  }
                }
                await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['ai-done'] });
                // GitHub solo auto-cierra con keywords al fusionar en la rama por defecto;
                // este repo fusiona contra dev, así que el cierre lo hace el workflow.
                if (issue.state === 'open') {
                  await github.rest.issues.update({ owner, repo, issue_number: n, state: 'closed' });
                  core.notice(`#${n}: issue cerrada`);
                }
                core.info(`#${n}: → ai-done`);
              } catch (e) {
                core.warning(`#${n}: ${e.message}`);
              }
            }
