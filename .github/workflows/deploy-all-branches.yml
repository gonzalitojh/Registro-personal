name: deploy-all-branches

# Despliega GitHub Pages con TODAS las ramas del repositorio:
#   - main          → raíz        (https://<user>.github.io/<repo>/)
#   - cada rama     → /<rama>/    (web completa en su subdirectorio)
# El workflow NO hace push (solo lee el repo y sube un artefacto a Pages),
# así que no existe riesgo de bucle infinito.
#
# Política de triggers (issue #98): cada push a main/dev reconstruye TODAS
# las ramas. Antes el workflow se disparaba en cada push de cualquier rama y,
# con picos de actividad, la cola de deployments de Pages se saturaba
# (deployments en `deployment_queued`) y actions/deploy-pages abortaba a los
# 10 minutos con 'Timeout reached, aborting!'. Ahora los merges a main/dev
# refrescan el sitio completo y el preview de cada rama abierta; para forzar
# un re-despliegue sin merge se usa workflow_dispatch ("Run workflow").

on:
  push:
    branches: [main, dev]
  workflow_dispatch: # re-despliegue manual desde la UI
  delete:            # al borrar una rama/tag, reconstruir el sitio
                     # (el evento delete no admite filtros; el guard está
                     #  en el job build)

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola ejecución a la vez para Pages; si llega otra, la cancelamos.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Guard para el evento delete: descartar borrados de tags y quedarse
    # solo con borrados de ramas. En push/workflow_dispatch ref_type no
    # existe → la condición se evalúa true y el job siempre se ejecuta.
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    steps:
      - name: "Checkout con todas las ramas (fetch-depth: 0)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar GitHub Pages (prerequisito de deploy-pages)
        uses: actions/configure-pages@v5
        with:
          enablement: true   # migra Pages legacy → Actions si procede (sustituye al hack gh api)

      - name: Construir _site con todas las ramas
        run: bash scripts/build-pages-site.sh

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4